[package]
name = "chunk-injector-gui"
version = "0.1.0"
description = "Interface Desktop em Tauri 2 para o Chunk Injector dos dotfiles"
authors = ["Max Gutierrez"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
